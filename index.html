function toast(t){const e=$('ts');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200)}
function setSt(t,c){$('st').textContent=t;$('sy').className='sy '+(c||'')}
function store(){try{localStorage.setItem('jt_jobs',JSON.stringify(jobs));localStorage.setItem('jt_skills',JSON.stringify(skl));localStorage.setItem('jt_cfg',JSON.stringify(cfg))}catch(e){}}
function persist(){store();if(cfg.url){ls('jt_dirty','1');clearTimeout(tmr);setSt('menyimpan…','bz');tmr=setTimeout(push,1200)}else setSt('mode lokal')}

/* ---------- Apps Script ---------- */
async function api(action,data,ms){
 if(!cfg.url)throw new Error('URL Apps Script belum diisi (⚙ Pengaturan)');
 const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||45000);
 try{const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({pw:cfg.pw||'',action},data||{})),signal:c.signal});
  const x=await r.text();let d;try{d=JSON.parse(x)}catch(e){throw new Error('Respons bukan dari Apps Script. Cek Deploy Web app, akses Anyone, URL berakhiran /exec')}
  if(d.error)throw new Error(d.error);return d}
 catch(e){if(e.name==='AbortError')throw new Error('Waktu habis, coba lagi');if(e instanceof TypeError)throw new Error('Tidak bisa terhubung ke internet / URL');throw e}
 finally{clearTimeout(t)}}
async function push(){if(!cfg.url)return;setSt('menyimpan…','bz');
 try{const snap=JSON.stringify([jobs,skl]);await api('save',{jobs});await api('saveSkills',{skills:skl});if(JSON.stringify([jobs,skl])===snap)ls('jt_dirty',null);setSt('tersinkron','ok')}
 catch(e){setSt(e.message,'er')}}
async function pull(silent){if(!silent)setSt('memuat…','bz');const old=JSON.stringify([jobs,skl].map(a=>a.map(({id,...r})=>r)));
 try{const d=await api('list'),first=!lg('jt_synced');let extra=[];
  if(first||!d.jobs.length){const h=new Set(d.jobs.map(key));extra=jobs.filter(j=>!h.has(key(j)))}
  jobs=d.jobs.map(j=>Object.assign({id:uid()},j,{status:norm(j.status)})).concat(extra);
  try{const s=await api('skills');if(s.skills.length||!skl.length)skl=s.skills.map(x=>Object.assign({id:uid()},x));else extra=extra.concat([1])}catch(e){}
  store();ls('jt_synced','1');if(extra.length)await push();else{ls('jt_dirty',null);setSt('tersinkron','ok')}
  const nw=JSON.stringify([jobs,skl].map(a=>a.map(({id,...r})=>r)));if(!silent||old!==nw)render()}catch(e){if(!silent)setSt(e.message,'er')}}
const sync=()=>lg('jt_dirty')?push():pull();

function anim(root){(root||document).querySelectorAll('.rise').forEach((e,i)=>e.style.animationDelay=Math.min(i*45,450)+'ms');
 (root||document).querySelectorAll('[data-n],[data-m]').forEach(e=>{const to=+(e.dataset.n||e.dataset.m),t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900),v=Math.round(to*(1-Math.pow(1-p,3)));e.textContent=v;if(p<1)requestAnimationFrame(f)})(t0)})}

 $('nv').innerHTML=NAV.map(n=>`<button data-go="${n[0]}" class="${n[0]===view?'on':''}">${n[1]}</button>`).join('');

 close(){closeM()},

  try{const x=(await api('extract',{urls:[u]},60000)).items[0];const set=(i,v)=>{if(v&&!/^\(lengkapi\)/.test(v)&&!$(i).value)$(i).value=v};set('jc',x.company);set('jp',x.position);set('jl',x.location);set('jd',x.date);

 savecfg(){cfg.url=g('cu');cfg.target=+$('ct').value||300;store();closeM();render();toast('Pengaturan disimpan');if(cfg.url)pull();else setSt('mode lokal')},
 ping(){cfg.url=g('cu');store();toast('Menguji…');api('ping').then(d=>toast('Terhubung, '+d.rows+' baris')).catch(e=>toast(e.message))},
 lock(){ls('jt_auth',null);try{sessionStorage.removeItem('jt_auth')}catch(e){}location.reload()},

};

/* ---------- Login ---------- */
async function chk(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===H}catch(e){return p===atob(B)}}
function enter(){$('lk').classList.add('out');setTimeout(()=>$('lk').hidden=true,500);$('app').hidden=false;render();
 if(cfg.url)sync();else setSt('mode lokal');deep()}
async function login(){const p=$('lp').value;if(await chk(p)){cfg.pw=p;store();
  if($('lr').checked)ls('jt_auth',H);else try{sessionStorage.setItem('jt_auth',H)}catch(e){}enter()}
 else{$('le').textContent='Password salah, coba lagi.';const c=$('lc');c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');$('lp').select()}}
$('lb').onclick=login;$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('lt').onclick=()=>{const i=$('lp'),s=i.type==='password';i.type=s?'text':'password';$('lt').textContent=s?'Sembunyi':'Lihat'};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('app').hidden&&cfg.url&&!lg('jt_dirty')&&!document.querySelector('.mo'))pull()});
window.addEventListener('online',()=>{if(cfg.url&&!$('app').hidden)sync()});
let ok=lg('jt_auth')===H;try{ok=ok||sessionStorage.getItem('jt_auth')===H}catch(e){}
if(ok&&cfg.pw){$('lk').hidden=true;$('app').hidden=false;render();if(cfg.url)sync();else setSt('mode lokal');deep()}else $('lp').focus();

function deep(){const p=new URLSearchParams(location.search),n=p.get('new');if(!n)return;history.replaceState(null,'',location.pathname);
 if(n==='skill'){view='skill';render();openSkill()}else{view='job';render();openJob()}}
/* perbarui otomatis tiap 60 detik bila ada perubahan dari perangkat lain atau dari spreadsheet */
setInterval(()=>{const a=document.activeElement;if(document.hidden||$('app').hidden||!cfg.url||lg('jt_dirty')||document.querySelector('.mo')||(a&&/INPUT|SELECT/.test(a.tagName)))return;pull(true)},60000);
/* kunci zoom */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].includes(e.key))e.preventDefault()});
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<300)e.preventDefault();lt=n},{passive:false});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
